name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Banking77 and the ONNX embedding models are downloaded once, pinned and hash-checked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/warmstart
          key: warmstart-data-${{ hashFiles('warmstart/data.py') }}
      - run: pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      # This branch is a demonstration: it carries answers shared across customers, which the gate exists to refuse. The job
      # passes only when the gate fails it for that reason, and fails if the gate lets it through.
      - name: Gate (must refuse this change)
        shell: bash
        run: |
          set +e
          python -m warmstart gate 2>&1 | tee gate.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then echo "::error::the gate let this change through"; exit 1; fi
          grep -qF -- 'GATE: ' gate.log || { echo "::error::the gate failed for another reason"; exit 1; }
          echo "::notice::The gate refused this change, as it should."
