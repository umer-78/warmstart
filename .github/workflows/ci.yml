name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Banking77 and the ONNX embedding models are downloaded once, pinned and hash-checked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/warmstart
          key: warmstart-data-${{ hashFiles('warmstart/data.py') }}
      - run: pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Cache gate (under 1% wrong answers, no leaks, no stale answers, hit rate held)
        run: python -m warmstart gate
