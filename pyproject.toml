[project]
name = "warmstart"
version = "0.1.0"
description = "A semantic cache for an LLM support assistant, with a replay harness that measures its hit rate, savings and wrong answers"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy==2.4.6", "scikit-learn==1.9.1", "onnxruntime==1.30.0", "tokenizers==0.23.2",
                "fastapi==0.141.1", "httpx==0.28.1", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["warmstart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
